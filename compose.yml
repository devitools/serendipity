services:
  app:
    container_name: serendipity-app
    build:
      context: .docker/ci
    volumes:
      - ./:/opt/www
    environment:
      - SCAN_CACHEABLE=false
      - STDOUT_LOG_LEVEL=alert,critical,emergency,error,warning,notice,info,debug
      - SONAR_TOKEN=${SONAR_TOKEN:-undefined}
    entrypoint: [ 'tail', '-f', '/dev/null' ]
    healthcheck:
      test: [ "CMD-SHELL", "php -v || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - serendipity-network
    restart: on-failure
    ports:
      - "9600:9501"

  valkey:
    image: valkey/valkey:8.0-alpine@sha256:19f0b3d350f5e6de618086d79ecdc9c474ab159bebb16ed95a92e4211562fee5
    command: ['valkey-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 2s
      retries: 5
    networks:
      - serendipity-network

  postgres:
    container_name: serendipity-postgres
    profiles:
      - postgres
    image: postgres:16.2
    tty: true
    environment:
      - POSTGRES_DB=${DB_POSTGRES_NAME:-database}
      - POSTGRES_USER=${DB_POSTGRES_USERNAME:-username}
      - POSTGRES_PASSWORD=${DB_POSTGRES_PASSWORD:-password}
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U ${DB_POSTGRES_USERNAME:-username} -d ${DB_POSTGRES_NAME:-database}'" ]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - serendipity-postgres-data:/var/lib/postgresql/data
    networks:
      - serendipity-network
    ports:
      - "9610:5432"

  mongo:
    container_name: serendipity-mongo
    profiles:
      - mongo
    image: mongo:6.0
    hostname: mongo
    command: --replSet rs0
    volumes:
      - serendipity-mongo-data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "quit(db.hello().isWritablePrimary ? 0 : 1)" ]
      interval: 10s
      start_period: 30s
    networks:
      - serendipity-network
    ports:
      - "9620:27017"

  mongo-bootstrap:
    container_name: serendipity-mongo-bootstrap
    profiles:
      - mongo
    image: mongo:6.0
    command: /bin/sh -c "/scripts/bootstrap.sh"
    depends_on:
      - mongo
    volumes:
      - ./.docker/mongo/bootstrap.sh:/scripts/bootstrap.sh:ro
    networks:
      - serendipity-network

volumes:
  serendipity-postgres-data:
  serendipity-mongo-data:

networks:
  serendipity-network:
    name: serendipity-network
